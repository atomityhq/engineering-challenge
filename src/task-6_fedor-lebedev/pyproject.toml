[project]
name = "g2-gate"
version = "0.1.0"
description = "Task 6: G2 evidence and current-validity gate (prototype, uncalibrated)."
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
