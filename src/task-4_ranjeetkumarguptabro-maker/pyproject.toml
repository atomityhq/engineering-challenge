[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resumable-review-workflow"
version = "0.1.0"
description = "Atomity Task 4: Resumable Review Workflow with LangGraph"
authors = [{ name = "Ranjeet Kumar Gupta" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
review-workflow = "workflow.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
