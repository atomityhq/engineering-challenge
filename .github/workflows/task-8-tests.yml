name: Task 8 - Tests and Replay

on:
  pull_request:
    paths:
      - "src/task-8_drain-suiucide/**"
      - ".github/workflows/task-8-tests.yml"
  push:
    branches:
      - main
      - submission/task-8-drain-suiucide
    paths:
      - "src/task-8_drain-suiucide/**"
      - ".github/workflows/task-8-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    defaults:
      run:
        working-directory: src/task-8_drain-suiucide

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile source and tests
        run: |
          python -m py_compile \
            workflow_audit/contracts.py \
            workflow_audit/workflow.py \
            tests/test_audit_replay.py \
            tests/test_operation_result.py

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Check saved examples for synthetic secret leakage
        shell: bash
        run: |
          if grep -R -n -F -- 'synthetic-secret-123' examples; then
            echo "::error::Synthetic secret found in saved examples."
            exit 1
          fi

          echo "PASS: no planted secret in saved examples."

      - name: Verify successful example
        run: python -m workflow_audit verify --run-dir examples/successful-run

      - name: Replay successful example offline
        run: python -m workflow_audit replay --run-dir examples/successful-run

      - name: Verify failed-operation example
        run: python -m workflow_audit verify --run-dir examples/failed-operation

      - name: Replay failed-operation example offline
        run: python -m workflow_audit replay --run-dir examples/failed-operation